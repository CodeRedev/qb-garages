<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Garage UI</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app" class="app" hidden>
    <header class="top">
        <div class="brand">
            <div class="bico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11h1a1 1 0 0 1 1 1v5h-2v1.5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V17H8v1.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V17H3v-5a1 1 0 0 1 1-1h1zm3.4-4-1.1 4h9.4l-1.1-4H8.4z"/></svg></div>
            <div><h1 id="garage-header">Garage</h1><p id="garage-sub">0 vehicles</p></div>
        </div>
        <button class="close" id="close-btn">Close <span>ESC</span></button>
    </header>

    <nav class="left">
        <div class="tabs" id="chips"></div>
        <label class="search"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search" type="text" placeholder="Search name or plate" autocomplete="off" /></label>
        <div class="menu" id="list"></div>
        <div class="sorts" id="sorts"><small>Sort</small><button data-sort="name" class="on">A-Z</button><button data-sort="fuel">Fuel</button><button data-sort="distance">Miles</button></div>
    </nav>

    <main class="right" id="detail"></main>
</div>
<script src="script.js"></script>
</body>
</html>
